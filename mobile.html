<script>
(function(){
'use strict';
var templates=[].slice.call(document.querySelectorAll('.slide-template'));
var viewer=document.getElementById('viewer'), canvas=document.getElementById('canvas');
var counter=document.getElementById('counter'), title=document.getElementById('slideTitle'), eyebrow=document.getElementById('eyebrow'), prog=document.querySelector('#progress>i');
var current=0, warming={}, touchX=0,touchY=0, moving=false;
var idMap={};
templates.forEach(function(t,i){var node=t.content.querySelector('.slide');if(node&&node.id)idMap[node.id]=i;});
function scaleCanvas(){
 var portrait=innerHeight>=innerWidth;
 var maxW=portrait?innerWidth-20:innerWidth-18;
 var maxH=portrait?maxW*9/16:innerHeight-18;
 var s=Math.min(maxW/1920,maxH/1080);
 var w=Math.round(1920*s),h=Math.round(1080*s);
 canvas.style.width=w+'px';canvas.style.height=h+'px';
 var slide=viewer.querySelector('.slide');if(slide) slide.style.transform='scale('+s+')';
}
function loadImage(img, priority){
 var full=img.getAttribute('data-full'); if(!full) return Promise.resolve();
 return new Promise(function(resolve){
  var pre=new Image(); pre.decoding='async'; if(priority) pre.fetchPriority=priority;
  pre.onload=function(){
   var done=function(){img.src=full;img.classList.add('full-loaded');resolve();};
   if(pre.decode) pre.decode().then(done).catch(done); else done();
  };
  pre.onerror=function(){resolve();}; pre.src=full;
 });
}
function prepareCurrent(section){
 var imgs=[].slice.call(section.querySelectorAll('img[data-full]'));
 imgs.forEach(function(img,i){loadImage(img,i===0?'high':'auto');});
 section.querySelectorAll('video').forEach(function(v){
  var fp=v.getAttribute('data-full-poster');
  if(fp){var pi=new Image();pi.onload=function(){v.poster=fp;};pi.src=fp;}
  var s=v.querySelector('source[data-video-src]'); if(s&&!s.src){s.src=s.getAttribute('data-video-src');v.preload='metadata';v.load();}
 });
}
function warmSlide(i){
 if(i<0||i>=templates.length||warming[i])return; warming[i]=1;
 var frag=templates[i].content;
 var paths=[]; frag.querySelectorAll('img[data-full]').forEach(function(img){var p=img.getAttribute('data-full');if(p&&paths.indexOf(p)<0)paths.push(p);});
 paths.slice(0,6).forEach(function(p){var im=new Image();im.decoding='async';im.fetchPriority='low';im.src=p;});
 var v=frag.querySelector('video[data-full-poster]');if(v){var im=new Image();im.src=v.getAttribute('data-full-poster');}
}
function render(i, instant){
 i=Math.max(0,Math.min(templates.length-1,i)); if(moving)return; moving=true; current=i;
 var frag=templates[i].content.cloneNode(true); var sec=frag.querySelector('.slide');
 viewer.replaceChildren(frag); sec=viewer.querySelector('.slide');
 scaleCanvas();
 requestAnimationFrame(function(){requestAnimationFrame(function(){sec.classList.add('m-in');moving=false;});});
 counter.textContent=String(i+1).padStart(2,'0')+' / '+String(templates.length).padStart(2,'0');
 title.textContent=templates[i].getAttribute('data-label')||('Slide '+(i+1));
 eyebrow.textContent=i===0?'Selected AI work':'Portfolio 2026';
 prog.style.width=((i+1)/templates.length*100)+'%';
 // Let the placeholder presentation paint first; sharpen immediately after the first visual frame.
 setTimeout(function(){prepareCurrent(sec);},140);
 setTimeout(function(){warmSlide(i+1);warmSlide(i-1);},650);
 setTimeout(function(){warmSlide(i+2);},1600);
 try{history.replaceState(null,'',location.pathname+'#slide-'+(i+1));}catch(e){}
}
function go(delta){render(current+delta);}
function jump(i){document.getElementById('menu').classList.remove('open');render(i);}
function startIndex(){
 var h=location.hash||''; var m=h.match(/slide-(\d+)/); if(m)return Math.max(0,Math.min(templates.length-1,+m[1]-1));
 if(h.length>1&&idMap[h.slice(1)]!=null)return idMap[h.slice(1)]; return 0;
}
viewer.addEventListener('click',function(e){
 var a=e.target.closest&&e.target.closest('a');if(!a)return;var h=a.getAttribute('href')||'';
 if(h.charAt(0)==='#'){var id=h.slice(1);if(idMap[id]!=null){e.preventDefault();jump(idMap[id]);}}
});
['prev','edgePrev'].forEach(function(id){document.getElementById(id).addEventListener('click',function(){go(-1);});});
['next','edgeNext'].forEach(function(id){document.getElementById(id).addEventListener('click',function(){go(1);});});
document.getElementById('menuBtn').addEventListener('click',function(){var m=document.getElementById('menu');m.classList.add('open');m.setAttribute('aria-hidden','false');});
document.getElementById('sheetClose').addEventListener('click',function(){document.getElementById('menu').classList.remove('open');});
document.getElementById('menu').addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');});
document.querySelectorAll('.menu-item').forEach(function(b){b.addEventListener('click',function(){jump(+b.getAttribute('data-go'));});});
document.getElementById('fs').addEventListener('click',async function(){
 try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen({navigationUI:'hide'});else if(document.exitFullscreen)await document.exitFullscreen();}catch(e){}
 try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');}catch(e){}
 setTimeout(scaleCanvas,120);
});
window.addEventListener('resize',scaleCanvas);window.addEventListener('orientationchange',function(){setTimeout(scaleCanvas,180);});
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='ArrowDown')go(1);if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(-1);});
var app=document.getElementById('app');
app.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;touchX=e.touches[0].clientX;touchY=e.touches[0].clientY;},{passive:true});
app.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;if(Math.max(Math.abs(dx),Math.abs(dy))<45)return;if(Math.abs(dx)>=Math.abs(dy))go(dx<0?1:-1);else go(dy<0?1:-1);},{passive:true});
// Keep address bar on the clean root URL after mobile route loads.
try{if(location.pathname.endsWith('/mobile.html'))history.replaceState(null,'',location.pathname.replace(/mobile\.html$/,'')+(location.hash||''));}catch(e){}
render(startIndex(),true);
})();
</script>
